<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion à LINX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>



<div class="carte">
  <div class="entete">
    <h3>Bienvenue !</h3>
    <p>Connectez-vous à LINX.</p>
  </div>

  <div class="logo">LINX</div>

  <form id="loginForm">
    <label for="matricule">Matricule</label>
    <input
      type="text"
      id="matricule"
      placeholder="Entrez votre matricule"
      required
    >

    <label for="password">Mot de passe</label>

    <div class="password-box">
      <input
        type="password"
        id="password"
        placeholder="Entrez votre mot de passe"
        required
      >
      <button type="button" id="togglePassword">👁</button>
    </div>

    <label class="souvenir">
      <input type="checkbox" id="remember">
      Se souvenir de moi
    </label>

    <button type="submit" class="connexion">
      Connexion
    </button>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
