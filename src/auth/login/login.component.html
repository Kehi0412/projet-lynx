<div class="login-card">
  <div class="login-header">
    <h2>BIENVENUE A LINX!</h2>
    <p>Connectez-vous pour y acceder.</p>
  </div>
  <div class="logo-wrap">
    <img src="img_1.png" alt="Trésor" />
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="connexion()">
    <label>Matricule</label>
    <input type="text" formControlName="matricule" placeholder="Entrez votre matricule" />

    <label>Mot de passe</label>
    <div class="pwd-group">
      <input [type]="afficherMdp ? 'text' : 'password'" formControlName="motDePasse"
             placeholder="Entrez votre mot de passe" />
      <button type="button" class="eye" (click)="afficherMdp = !afficherMdp">👁</button>
    </div>

    <label class="remember">
      <input type="checkbox" formControlName="remember" /> Se souvenir de moi
    </label>
    <button type="submit" class="btn-connexion" [disabled]="isLoading">
      {{ isLoading ? 'Connexion en cours...' : 'Connexion' }}
    </button>
  </form>
</div>
